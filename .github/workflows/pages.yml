# Publish the twin pages (`zsa pages`) to GitHub Pages: an audit of QEDIT's public ZSA test network
# and Solana devnet, run here from the published registry, with one page per twin. Pull requests
# build the pages without deploying them.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (the --cfg zcash_unstable="nu7" flag comes from .cargo/config.toml)
        run: cargo build --release --locked
      - name: Audit and generate the pages
        run: ./target/release/zsa pages --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
